# Serves the built React SPA and proxies API calls to the backend container.
#
# Backend routes are mounted two ways (see backend/app/api/router.py):
#   - everything under /api/v1/...  (mandates, payments, dashboard, etc.)
#   - /health                       (mounted at the API root, no prefix)
# so both need their own proxy_pass rule.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses browser history (BrowserRouter) — any path that
    # isn't a real static file must fall back to index.html so client-side
    # routing handles it. This is also what makes refreshing on a deep route
    # like /observability work instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets (Vite fingerprints filenames) are safe to cache
    # indefinitely; index.html itself is never cached so a new deploy is
    # picked up on the next refresh instead of serving a stale shell.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
