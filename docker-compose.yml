# Local Docker Compose stack: postgres -> backend (FastAPI) -> frontend (Nginx).
#
# Quick start:
#   cp .env.example .env   # fill in GROQ_API_KEY / RAZORPAY_* if you have them
#   docker compose up --build
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:8000  (Swagger at /docs)
# Postgres: localhost:5432 (published for local psql/GUI access only)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mandate_password}
      POSTGRES_DB: ${POSTGRES_DB:-mandate_retry_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mandate_user} -d ${POSTGRES_DB:-mandate_retry_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Mandate Retry Sequencer}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      HOST: 0.0.0.0
      PORT: 8000
      # Host is hardcoded to the "postgres" service name (Docker's internal
      # DNS) — deliberately not taken from a generic DATABASE_URL var, since
      # that would otherwise need to differ between "run locally" (localhost)
      # and "run in Compose" (postgres) despite sharing one .env file.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mandate_user}:${POSTGRES_PASSWORD:-mandate_password}@postgres:5432/${POSTGRES_DB:-mandate_retry_db}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}'
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-penai/gpt-oss-20b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30.0}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      RETRY_BACKOFF: ${RETRY_BACKOFF:-0.5}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      RAZORPAY_TIMEOUT: ${RAZORPAY_TIMEOUT:-15.0}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Kolkata}
      SCHEDULER_RETRY_INTERVAL_SECONDS: ${SCHEDULER_RETRY_INTERVAL_SECONDS:-60}
      SCHEDULER_SETTLEMENT_INTERVAL_SECONDS: ${SCHEDULER_SETTLEMENT_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
